<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}ShagunSetu - Digital Registry & Invitations{% endblock %}</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel+Decorative:wght@600;700&family=Cormorant+Garamond:ital,wght@0,400;0,600;0,700;1,400&family=Great+Vibes&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/static/css/style.css">
  {% block extra_head %}{% endblock %}
</head>
<body>

  <!-- Navigation Bar -->
  <header style="background: rgba(255, 255, 255, 0.94); backdrop-filter: blur(8px); border-bottom: 2px solid var(--wedding-gold); position: sticky; top: 0; z-index: 100;">
    <div style="max-width: 1050px; margin: 0 auto; padding: 0.8rem 1.2rem; display: flex; justify-content: space-between; align-items: center;">
      <a href="/" style="text-decoration: none; display: flex; align-items: center; gap: 8px;">
        <span style="font-size: 1.5rem;">🪔</span>
        <span style="font-family: 'Cinzel Decorative', serif; font-size: 1.3rem; font-weight: 700; color: var(--mandap-crimson);">ShagunSetu</span>
      </a>
      <nav style="display: flex; gap: 1.2rem; align-items: center;">
        <a href="/" style="text-decoration: none; color: var(--text-primary); font-weight: 600;">Home</a>
        <a href="/wizard" style="text-decoration: none; color: var(--text-primary); font-weight: 600;">Create Patrika</a>
        <a href="/admin" class="btn-wedding-crimson" style="padding: 0.4rem 1.2rem; font-size: 0.85rem;">Dashboard</a>
      </nav>
    </div>
  </header>

  <!-- Main Canvas -->
  <main class="banana-leaf-bg">
    <div class="marigold-toran"></div>
    {% block content %}{% endblock %}
    <div class="marigold-toran marigold-toran-bottom"></div>
  </main>

  <!-- Footer -->
  <footer style="background: var(--mandap-crimson); color: var(--wedding-gold-light); text-align: center; padding: 2rem 1rem; border-top: 3px solid var(--wedding-gold);">
    <div style="font-size: 1.5rem; margin-bottom: 0.3rem; color: var(--marigold-yellow);">卐 || मंगलम् भगवान विष्णुः, मंगलम् गरुड़ध्वजः || 卐</div>
    <p style="margin: 0; font-family: 'Cinzel Decorative', serif; font-size: 0.9rem;">ShagunSetu • Digital Wedding Registry &amp; Logistics</p>
  </footer>

  <script src="/static/js/common.js"></script>
  {% block extra_scripts %}{% endblock %}
</body>
</html>
