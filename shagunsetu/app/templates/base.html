<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}ShagunSetu - Shubh Vivah & Auspicious Invitations{% endblock %}</title>

  <!-- Google Fonts: Royal Indian Wedding Typography -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel+Decorative:wght@600;700;900&family=Cormorant+Garamond:ital,wght@0,400;0,600;0,700;1,400&family=Great+Vibes&display=swap" rel="stylesheet">

  <!-- Core Stylesheet -->
  <link rel="stylesheet" href="{{ url_for('static', path='/css/style.css') }}">
  {% block extra_head %}{% endblock %}
</head>
<body>

  <!-- Floating Flower Petals Animation Layer -->
  <div class="petal" style="left: 8%; animation-delay: 0s;"></div>
  <div class="petal" style="left: 24%; animation-delay: 3s;"></div>
  <div class="petal" style="left: 45%; animation-delay: 1.5s;"></div>
  <div class="petal" style="left: 68%; animation-delay: 4.5s;"></div>
  <div class="petal" style="left: 88%; animation-delay: 2s;"></div>

  <!-- Navigation Bar -->
  <header style="background: rgba(255, 255, 255, 0.9); backdrop-filter: blur(8px); border-bottom: 2px solid var(--wedding-gold); position: sticky; top: 0; z-index: 100;">
    <div style="max-width: 1100px; margin: 0 auto; padding: 0.85rem 1.5rem; display: flex; justify-content: space-between; align-items: center;">
      <a href="/" style="text-decoration: none; display: flex; align-items: center; gap: 8px;">
        <span style="font-size: 1.6rem; color: var(--marigold-orange);">🪔</span>
        <span style="font-family: 'Cinzel Decorative', serif; font-size: 1.35rem; font-weight: 700; color: var(--mandap-crimson); letter-spacing: 1px;">ShagunSetu</span>
      </a>
      <nav style="display: flex; gap: 1.5rem; align-items: center;">
        <a href="/" style="text-decoration: none; color: var(--text-primary); font-weight: 600;">Home</a>
        <a href="/wizard" style="text-decoration: none; color: var(--text-primary); font-weight: 600;">Create Patrika</a>
        <a href="/admin" class="btn-wedding-crimson" style="padding: 0.4rem 1.2rem; font-size: 0.85rem;">Admin</a>
      </nav>
    </div>
  </header>

  <!-- Main Content Wrapper with Banana Leaf Framing -->
  <main class="banana-leaf-bg">
    <div class="marigold-toran"></div>
    {% block content %}{% endblock %}
    <div class="marigold-toran marigold-toran-bottom"></div>
  </main>

  <!-- Auspicious Footer -->
  <footer style="background: var(--mandap-crimson); color: var(--wedding-gold-light); text-align: center; padding: 2.5rem 1rem; border-top: 3px solid var(--wedding-gold);">
    <div style="font-size: 1.8rem; margin-bottom: 0.5rem; color: var(--marigold-yellow);">卐 || मंगलम् भगवान विष्णुः, मंगलम् गरुड़ध्वजः || 卐</div>
    <p style="margin: 0; font-family: 'Cinzel Decorative', serif; font-size: 0.95rem; letter-spacing: 1px;">ShagunSetu • Auspicious Digital Celebrations</p>
  </footer>

  <script src="{{ url_for('static', path='/js/common.js') }}"></script>
  {% block extra_scripts %}{% endblock %}
</body>
</html>
