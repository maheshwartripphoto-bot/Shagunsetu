{% extends "base.html" %}

{% block title %}Create Auspicious E-Patrika | ShagunSetu{% endblock %}

{% block content %}
<div style="max-width: 800px; margin: 2rem auto; padding: 0 1rem;">
  <div class="mandap-frame">
    <div class="mandap-pillar-left"></div>
    <div class="mandap-pillar-right"></div>

    <div class="text-center">
      <div class="mandap-arch"></div>
      <div class="auspicious-symbol">🪔 || शुभ लग्न विवरण || 🪔</div>
      <h2 class="wedding-title">Craft Your Wedding Invitation</h2>
      <p style="color: var(--text-muted); font-style: italic;">Enter your ceremonial details to generate a royal card</p>
    </div>

    <form method="POST" action="/create" style="display: flex; flex-direction: column; gap: 1.4rem; margin-top: 2rem;">
      <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); gap: 1rem;">
        <div>
          <label style="display: block; font-weight: 600; margin-bottom: 0.4rem; color: var(--mandap-crimson);">Groom's Full Name (वर)</label>
          <input type="text" name="groom_name" placeholder="e.g. Rahul Sharma" required style="width: 100%;">
        </div>
        <div>
          <label style="display: block; font-weight: 600; margin-bottom: 0.4rem; color: var(--mandap-crimson);">Bride's Full Name (वधू)</label>
          <input type="text" name="bride_name" placeholder="e.g. Priya Patel" required style="width: 100%;">
        </div>
      </div>

      <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); gap: 1rem;">
        <div>
          <label style="display: block; font-weight: 600; margin-bottom: 0.4rem; color: var(--mandap-crimson);">Wedding Date (विवाह तिथि)</label>
          <input type="date" name="event_date" required style="width: 100%;">
        </div>
        <div>
          <label style="display: block; font-weight: 600; margin-bottom: 0.4rem; color: var(--mandap-crimson);">Auspicious Muhurat Time (शुभ मुहूर्त)</label>
          <input type="text" name="muhurat_time" placeholder="e.g. 07:15 PM Godhuli Bela" style="width: 100%;">
        </div>
      </div>

      <div>
        <label style="display: block; font-weight: 600; margin-bottom: 0.4rem; color: var(--mandap-crimson);">Wedding Venue (स्थान)</label>
        <input type="text" name="venue" placeholder="e.g. Rajwada Palace, Indore" required style="width: 100%;">
      </div>

      <div>
        <label style="display: block; font-weight: 600; margin-bottom: 0.4rem; color: var(--mandap-crimson);">Host Families &amp; Blessings Line</label>
        <textarea name="host_family" rows="3" placeholder="e.g. With best compliments from Sharma & Patel Family..." style="width: 100%;"></textarea>
      </div>

      <div class="text-center" style="margin-top: 1rem;">
        <button type="submit" class="btn-wedding-gold" style="width: 100%; max-width: 320px;">
          Generate E-Patrika ✨
        </button>
      </div>
    </form>
  </div>
</div>
{% endblock %}
