{% extends "base.html" %}

{% block content %}
<div style="max-width: 840px; margin: 2rem auto; padding: 0 1rem;">
  <div class="mandap-frame">
    <div class="mandap-pillar-left"></div>
    <div class="mandap-pillar-right"></div>

    <div class="text-center">
      <div class="mandap-arch"></div>
      <div class="auspicious-symbol">🪔 || शुभ लग्न पत्रिका निर्माण || 🪔</div>
      <h2 class="wedding-title">Setup Your Wedding &amp; Events</h2>
      <p style="color: var(--text-muted); font-style: italic;">
        Enter core wedding details. You can add more multi-day functions (Haldi, Sangeet, Reception) anytime.
      </p>
    </div>

    <form method="POST" action="/create" style="display: flex; flex-direction: column; gap: 1.2rem; margin-top: 2rem;">
      <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 1rem;">
        <div>
          <label style="display: block; font-weight: 600; color: var(--mandap-crimson);">Groom's Name (वर)</label>
          <input type="text" name="groom_name" placeholder="e.g. Rahul Sharma" required style="width: 100%;">
        </div>
        <div>
          <label style="display: block; font-weight: 600; color: var(--mandap-crimson);">Bride's Name (वधू)</label>
          <input type="text" name="bride_name" placeholder="e.g. Priya Patel" required style="width: 100%;">
        </div>
      </div>

      <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 1rem;">
        <div>
          <label style="display: block; font-weight: 600; color: var(--mandap-crimson);">Main Wedding Date</label>
          <input type="date" name="wedding_date" required style="width: 100%;">
        </div>
        <div>
          <label style="display: block; font-weight: 600; color: var(--mandap-crimson);">Main Venue / City</label>
          <input type="text" name="venue" placeholder="e.g. Rajwada Palace, Indore" required style="width: 100%;">
        </div>
      </div>

      <div>
        <label style="display: block; font-weight: 600; color: var(--mandap-crimson);">Host Family / Invitation Line</label>
        <input type="text" name="host_family" placeholder="e.g. Smt. & Shri Sharma cordially invite you..." style="width: 100%;">
      </div>

      <div style="border-top: 2px dashed var(--wedding-gold); padding-top: 1.2rem; margin-top: 0.5rem;">
        <h4 style="color: var(--mandap-crimson); margin-bottom: 0.4rem;">🪙 Digital Shagun Configuration</h4>
        <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 1rem;">
          <div>
            <label style="display: block; font-weight: 600;">Receiving UPI ID (GPay/PhonePe)</label>
            <input type="text" name="upi_id" placeholder="e.g. rahul@okicici" required style="width: 100%;">
          </div>
          <div>
            <label style="display: block; font-weight: 600;">Payee Account Name</label>
            <input type="text" name="upi_payee_name" placeholder="e.g. Rahul &amp; Priya" required style="width: 100%;">
          </div>
        </div>
      </div>

      <div class="text-center" style="margin-top: 1.2rem;">
        <button type="submit" class="btn-wedding-gold" style="width: 100%; max-width: 320px;">
          Create Portal &amp; Add Events ✨
        </button>
      </div>
    </form>
  </div>
</div>
{% endblock %}
